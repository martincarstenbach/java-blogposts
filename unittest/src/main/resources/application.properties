spring.application.name=Demo

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

spring.jmx.enabled=true

spring.liquibase.change-log=classpath:db/changelog/controller.xml

spring.datasource.username=demouser
spring.datasource.password=${APP_USER_PASSWORD}
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/freepdb1
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.type=oracle.ucp.jdbc.PoolDataSource
spring.datasource.oracleucp.initial-pool-size=5
spring.datasource.oracleucp.min-pool-size=5
spring.datasource.oracleucp.max-pool-size=5
# DO NOT provide a name for the UCP or else unit tests will fail (they will try to create
# a second pool with the same name, which obviously fails)
#spring.datasource.oracleucp.connection-pool-name=unittestpool
spring.datasource.oracleucp.connection-factory-class-name=oracle.jdbc.pool.OracleDataSource

debug=true
